name: Offline CMake module builds

on:
  push:
    paths:
      - 'extension/**'
      - 'tests/integration/**'
      - '.github/workflows/offline-modules.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/integration/**'
      - '.github/workflows/offline-modules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zephyr: [v3.7.2, v4.5.0]
    steps:
      - uses: actions/checkout@v6
        with:
          path: extension-repo
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ matrix.zephyr }}
          path: zephyr
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare the local tools and sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf device-tree-compiler gperf ninja-build
          npm ci --prefix extension-repo/extension
          python -m venv "$RUNNER_TEMP/build-python"
          "$RUNNER_TEMP/build-python/bin/python" -m pip install PyYAML jsonschema pykwalify pyelftools packaging intelhex
      - name: Discover modules, configure and link without west or a network interface
        run: |
          cc=$(command -v riscv64-unknown-elf-gcc)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env -i ZEPHYR_TEST_ISOLATED_NETWORK=1 HOME="$HOME" LANG=C.UTF-8 PATH="$PATH" TMPDIR="$RUNNER_TEMP" \
            PYTHON="$RUNNER_TEMP/build-python/bin/python" ZEPHYR_BASE="$GITHUB_WORKSPACE/zephyr" \
            ZEPHYR_TOOLCHAIN_VARIANT=cross-compile CROSS_COMPILE="${cc%gcc}" \
            node extension-repo/tests/integration/offline-module-discovery.cjs
      - name: Keep configure and build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-build-logs-${{ matrix.zephyr }}
          path: |
            ${{ runner.temp }}/zephyr-offline-integration-*/build.log
            ${{ runner.temp }}/zephyr-offline-integration-*/offline-attempts.txt
          if-no-files-found: ignore
          retention-days: 7
