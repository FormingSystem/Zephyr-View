name: Native platform checks
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      desktop:
        description: Optional self-hosted Windows x64 desktop
        type: choice
        options: [hosted, windows-10, windows-11]
        default: hosted

permissions:
  contents: read

jobs:
  hosted:
    if: inputs.desktop == '' || inputs.desktop == 'hosted'
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check-extension
        with:
          windows-desktop: ${{ matrix.host == 'windows-11-arm' && '11' || '' }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release' && matrix.host == 'ubuntu-24.04'
        with:
          name: verified-release-vsix
          path: verified-release-vsix.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop != 'hosted'
    runs-on: [self-hosted, Windows, X64, "${{ inputs.desktop }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/check-extension
        with:
          windows-desktop: ${{ inputs.desktop == 'windows-10' && '10' || '11' }}
