name: Official Zephyr board catalogs
on:
  push:
    paths:
      - 'extension/**'
      - 'tests/*[Bb]oard*'
      - 'tests/integration/official-board-catalog.cjs'
      - '.github/workflows/board-catalogs.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'tests/*[Bb]oard*'
      - 'tests/integration/official-board-catalog.cjs'
      - '.github/workflows/board-catalogs.yml'
  workflow_dispatch:
    inputs:
      host:
        description: Test host
        type: choice
        options: [hosted, windows-10]
        default: hosted

permissions:
  contents: read

jobs:
  catalogs:
    strategy:
      fail-fast: false
      matrix:
        zephyr: [v3.6.0, v3.7.0, v3.7.2, v4.2.0, v4.3.0, v4.4.2, v4.5.0]
        host: ${{ inputs.host == 'windows-10' && fromJSON('["windows-10"]') || fromJSON('["windows-2022","ubuntu-24.04"]') }}
    runs-on: ${{ matrix.host == 'windows-10' && fromJSON('["self-hosted","Windows","X64","windows-10"]') || matrix.host }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: extension-repo
      - uses: actions/checkout@v6
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ matrix.zephyr }}
          path: source
          sparse-checkout: |
            arch
            boards
            cmake
            dts
            scripts
            share
            soc
            submanifests
            samples/hello_world
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Windows 10 client
        if: inputs.host == 'windows-10'
        run: python -c "import sys; sys.path.insert(0,'extension-repo/tests/native'); from check_host import verify_windows_desktop; verify_windows_desktop('10')"
      - name: Install the selected checkout's Python requirements
        working-directory: source
        run: python -m pip install -r scripts/requirements-base.txt
      - name: Compare both picker paths with the checkout's west boards
        run: node extension-repo/tests/integration/official-board-catalog.cjs source
